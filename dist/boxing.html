<title>הדרך לחגורה</title>
<meta name="theme-color" content="#0a0c11">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&display=swap">
<style>
/* ===== הדרך לחגורה — עיצוב ===== */
:root {
  --bg: #0a0c11;
  --surface: #151923;
  --surface-2: #1c2130;
  --surface-3: #262d3f;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .16);
  --text: #f2f4f8;
  --muted: #9ba4b6;
  --faint: #667087;
  --red: #d9363e;
  --gold: #f4b73f;
  --green: #2ec27e;
  --blue: #3f7ff0;
  --purple: #8b5cf6;
  --hp: #35c985;
  --sta: #4c95ff;
  --text-dark: #15110a;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.25);
  --shadow-md: 0 2px 4px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.38);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.45), 0 22px 56px rgba(0,0,0,.55);
  --font-display: "Secular One", "Rubik", system-ui, sans-serif;
  --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  background: radial-gradient(1100px 520px at 50% -12%, #1b2130 0%, rgba(27,33,48,0) 62%), var(--bg);
  background-color: var(--bg);
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; min-height: 100%; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }
.gold { color: var(--gold); }
.screen { display: flex; flex-direction: column; gap: 16px; animation: enter .35s ease both; }
@keyframes enter { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ----- כרטיסים וכפתורים ----- */
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.04); padding: 18px; }

.btn {
  font: inherit; font-weight: 700; color: var(--text); background: var(--surface-3);
  border: 0; border-radius: var(--r-md); padding: 11px 18px; min-height: 46px; cursor: pointer;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  position: relative; overflow: hidden; text-align: center;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.1);
  transition: transform .14s cubic-bezier(.3,.7,.4,1.6), filter .14s;
}
.btn small { font-weight: 500; font-size: 12px; opacity: .85; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.95); filter: brightness(.9); }
.btn:focus-visible, .swatch:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .42; cursor: not-allowed; transform: none; filter: none; }
.btn-red { background: var(--red); color: #fff; }
.btn-green { background: var(--green); color: var(--text-dark); }
.btn-gold { background: var(--gold); color: var(--text-dark); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-purple { background: var(--purple); color: #fff; }
.btn-ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.btn-danger { background: transparent; color: #ff8a8f; box-shadow: inset 0 0 0 1.5px rgba(255,120,125,.4); }
.btn-lg { font-family: var(--font-display); font-weight: 400; font-size: 20px; padding: 14px 26px; min-height: 58px; letter-spacing: .3px; }
.btn-lg small { font-family: var(--font-body); }
.btn-sm { min-height: 38px; padding: 7px 14px; font-size: 14px; }
.btn-icon { width: 46px; padding: 0; font-size: 20px; }
.sweep::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.3) 50%, transparent 65%);
  transform: translateX(-130%); transition: transform .7s ease;
}
.sweep:hover::after { transform: translateX(130%); }

.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; flex: 1; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--sta); transition: width .4s ease; }
.bar i.low { background: #e7883a; }
.bar.stat i { background: var(--green); }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
.nick { color: var(--gold); font-weight: 500; }
.bonus { font-size: 12px; font-weight: 700; color: var(--green); background: rgba(46,194,126,.12); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }

/* חגורה */
.belt {
  display: inline-block; width: 34px; height: 14px; border-radius: 4px; vertical-align: middle; position: relative;
  background: linear-gradient(90deg, #7a1d22 0 22%, #f4b73f 22% 78%, #7a1d22 78%);
  box-shadow: 0 1px 3px rgba(0,0,0,.5);
}
.belt::after { content: ""; position: absolute; inset: 2px 11px; border-radius: 3px; background: #ffe39a; box-shadow: inset 0 0 0 1.5px #b77e12; }
.belt.sm { width: 26px; height: 11px; }
.belt.sm::after { inset: 2px 8px; }

/* ----- מסך פתיחה ----- */
.title-screen { align-items: center; text-align: center; padding-top: 24px; position: relative; min-height: calc(100vh - 60px); justify-content: center; }
.aurora { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
.aurora i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .22; animation: drift 22s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { background: #d9363e; top: -25vmax; right: -15vmax; }
.aurora i:nth-child(2) { background: #f4b73f; bottom: -30vmax; left: -20vmax; opacity: .12; animation-duration: 28s; }
.aurora i:nth-child(3) { background: #3f7ff0; top: 30%; left: 35%; width: 36vmax; height: 36vmax; opacity: .1; animation-duration: 34s; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.1); } }
.title-emblem {
  width: min(380px, 78vw); height: auto; aspect-ratio: 1; display: block; margin-block: -14px -22px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 71%); mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 71%);
  filter: drop-shadow(0 10px 40px rgba(217,54,62,.35));
}
@media (orientation: landscape) and (max-height: 540px) { .title-emblem { width: min(240px, 44vh); } }
.logo {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(52px, 12vw, 104px); line-height: .95;
  background: linear-gradient(100deg, #fff 0%, #fff 38%, #ffd27a 50%, #fff 62%, #fff 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 6s linear infinite;
  filter: drop-shadow(0 6px 20px rgba(0,0,0,.6));
}
@keyframes shimmer { from { background-position: 125% 0; } to { background-position: -125% 0; } }
.tagline { color: var(--muted); font-size: 17px; max-width: 34ch; }
.title-actions { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); margin-top: 8px; }
.fine { color: var(--faint); font-size: 13px; }

/* ----- יצירת לוחם ----- */
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; }
.create-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.preview-card { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px;
  background: radial-gradient(circle at 50% 85%, #2a1a22 0%, var(--surface) 70%); }
.preview-lg { width: 100%; height: 380px; display: block; }
.pv-name { font-family: var(--font-display); font-size: 24px; text-align: center; min-height: 36px; }
.options { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.flabel { font-size: 13px; font-weight: 700; color: var(--muted); }
.opt { font-weight: 400; color: var(--faint); }
input {
  font: inherit; color: var(--text); background: var(--surface-2); border: 0; border-radius: var(--r-sm);
  padding: 12px 14px; box-shadow: inset 0 0 0 1.5px var(--line); width: 100%;
}
input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--gold); }
.swatches, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 5px rgba(0,0,0,.4);
  transition: transform .14s cubic-bezier(.3,.7,.4,1.6);
}
.swatch:active { transform: scale(.9); }
.swatch.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--gold); transform: scale(1.06); }
.chip {
  font: inherit; font-weight: 500; color: var(--text); background: var(--surface-2); border: 0; cursor: pointer;
  border-radius: 99px; padding: 8px 16px; box-shadow: inset 0 0 0 1.5px var(--line);
  transition: transform .14s cubic-bezier(.3,.7,.4,1.6);
}
.chip:active { transform: scale(.93); }
.chip.on { background: var(--gold); color: var(--text-dark); font-weight: 700; box-shadow: none; }
.form-err { color: #ff8a8f; font-weight: 500; }

/* ----- מרכז הקריירה ----- */
.profile-bar { display: flex; align-items: center; gap: 16px; padding: 12px 18px; }
.preview-sm { width: 92px; height: 132px; flex: none; }
.pb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pb-name { font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.pb-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 14px; align-items: center; }
.pb-meta b { color: var(--text); }
.rank-pill { background: rgba(63,127,240,.16); color: #9cc0ff; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 99px; }
.energy { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); max-width: 340px; }
.energy b { color: var(--text); min-width: 28px; }
.pb-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.money { font-family: var(--font-display); font-size: 30px; color: var(--gold); line-height: 1; }
.ovr { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: 12px; }
.ovr b { font-size: 20px; color: var(--text); }
.belts { display: flex; gap: 4px; }

.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: var(--surface); padding: 6px; border-radius: var(--r-md); box-shadow: var(--shadow-sm); }
.tab {
  font: inherit; font-weight: 700; color: var(--muted); background: transparent; border: 0; border-radius: 10px;
  padding: 11px 6px; cursor: pointer; transition: transform .14s cubic-bezier(.3,.7,.4,1.6), background .2s, color .2s;
}
.tab:active { transform: scale(.95); }
.tab.on.t-red { background: var(--red); color: #fff; }
.tab.on.t-green { background: var(--green); color: var(--text-dark); }
.tab.on.t-gold { background: var(--gold); color: var(--text-dark); }
.tab.on.t-blue { background: var(--blue); color: #fff; }
.tab.on.t-purple { background: var(--purple); color: #fff; }
.tab-body { animation: enter .25s ease both; }

/* קרבות */
.fight-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.next-fight { display: flex; flex-direction: column; gap: 14px; }
.next-fight.is-title { box-shadow: var(--shadow-md), inset 0 0 0 1.5px rgba(244,183,63,.45); }
.nf-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.is-title .eyebrow { color: var(--gold); }
.tier { font-size: 12px; font-weight: 700; color: #ff9da1; background: rgba(217,54,62,.15); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.nf-body { display: flex; gap: 14px; align-items: center; }
.preview-opp { width: 150px; height: 210px; flex: none; }
.nf-info { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.nf-info h3 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.05; }
.style-tag { font-size: 12px; font-weight: 700; background: var(--surface-3); padding: 3px 10px; border-radius: 99px; }
.facts { display: flex; gap: 20px; margin: 4px 0 0; }
.facts div { display: flex; flex-direction: column; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-weight: 800; font-size: 18px; }
.tape { display: flex; flex-direction: column; gap: 7px; background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; }
.tape-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); }
.tape-row { display: grid; grid-template-columns: 26px 1fr 64px 1fr 26px; align-items: center; gap: 8px; font-size: 13px; }
.tl { text-align: center; color: var(--muted); }
.tv { text-align: center; font-weight: 700; color: var(--muted); }
.tv.up { color: var(--text); }
.tb { height: 7px; background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden; display: flex; }
.tb i { display: block; height: 100%; border-radius: inherit; }
.tb.you i { background: var(--blue); }
.tb.them { justify-content: flex-end; }
.tb.them i { background: var(--red); }
.warn { background: rgba(231,136,58,.12); color: #ffb27a; border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; }
.ladder { display: flex; flex-direction: column; gap: 12px; }
.ladder ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ladder li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); font-size: 14px; }
.ladder .ln { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-3); flex: none; }
.ladder .lname { flex: 1; min-width: 0; }
.ladder .lname small { color: var(--faint); }
.ladder .lstat { font-size: 12px; color: var(--faint); }
.ladder li.done .ln { background: var(--green); color: var(--text-dark); }
.ladder li.done .lstat { color: var(--green); }
.ladder li.cur { background: rgba(217,54,62,.13); }
.ladder li.cur .ln { background: var(--red); color: #fff; }
.ladder li.cur .lstat { color: #ff9da1; font-weight: 700; }
.ladder li.locked { color: var(--faint); }
.champ-note { font-size: 14px; color: var(--muted); background: rgba(244,183,63,.1); border-radius: var(--r-sm); padding: 10px 12px; }

/* אימונים */
.train-grid, .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.train-card, .shop-card { display: flex; flex-direction: column; gap: 10px; }
.train-card .btn, .shop-card .btn { margin-top: auto; }
.tc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.stat-name { font-size: 12px; font-weight: 700; color: var(--green); }
.lvl { display: flex; align-items: baseline; gap: 6px; }
.lvl b { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1; }
.lvl .of { color: var(--faint); font-size: 13px; }
.lvl .bonus { margin-inline-start: auto; }
.train-card p, .shop-card p { font-size: 13px; }
.rest-card { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; }
.rest-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.rest-actions .btn { flex: 1 1 200px; }

/* חנות */
.sec-title { font-size: 14px; color: var(--muted); font-weight: 700; margin: 4px 2px 10px; }
.shop-grid + .sec-title { margin-top: 22px; }
.sc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pips { display: flex; gap: 4px; }
.pips i { width: 16px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); }
.pips i.on { background: var(--gold); }
.sc-now { font-size: 14px; color: var(--muted); }
.sc-now b { color: var(--text); }
.sc-next { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; background: var(--surface-2); padding: 10px 12px; border-radius: var(--r-sm); }
.maxed { color: var(--gold); font-weight: 700; font-size: 14px; margin-top: auto; }
.extra h3 { font-size: 18px; }

/* מלתחה */
.wardrobe { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
.wr-preview { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  background: radial-gradient(circle at 50% 85%, #231a38 0%, var(--surface) 70%); }
.preview-wr { width: 100%; height: 330px; display: block; }
.wr-try { font-size: 14px; color: var(--muted); }
.wr-try b { color: #c4b1ff; }
.small { font-size: 12px; }
.wr-list { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.wr-slot .sec-title { margin-bottom: 8px; }
.wr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.wr-item {
  background: var(--surface); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; align-items: stretch; gap: 4px;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.04); cursor: pointer; text-align: center;
  transition: transform .14s cubic-bezier(.3,.7,.4,1.6), box-shadow .2s;
}
.wr-item:active { transform: scale(.96); }
.wr-item canvas { width: 100%; height: 92px; display: block; border-radius: 10px; background: radial-gradient(circle at 50% 60%, #242a3a, #171b25); }
.wr-item.trying { box-shadow: var(--shadow-sm), inset 0 0 0 2px var(--purple); }
.wr-item.worn { box-shadow: var(--shadow-sm), inset 0 0 0 2px var(--green); }
.wr-name { font-weight: 700; font-size: 14px; line-height: 1.25; }
.wr-state { font-size: 12px; color: var(--faint); }
.wr-item.worn .wr-state { color: var(--green); }
.wr-item .btn { margin-top: 4px; }

/* פרופיל */
.profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.profile-grid .card { display: flex; flex-direction: column; gap: 12px; }
.profile-grid .settings { grid-column: 1 / -1; }
.stat-list { display: flex; flex-direction: column; gap: 10px; }
.sl-row { display: grid; grid-template-columns: 64px 1fr 30px; align-items: center; gap: 10px; font-size: 14px; }
.sl-row b { text-align: left; }
.belt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.belt-list li { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--gold); }
.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.history li { display: grid; grid-template-columns: 28px 1fr auto; grid-template-areas: "r n p" "r m p"; column-gap: 10px; align-items: center; padding: 8px 10px; background: var(--surface-2); border-radius: var(--r-sm); }
.history .res { grid-area: r; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.history .w .res { background: var(--green); color: var(--text-dark); }
.history .l .res { background: var(--red); color: #fff; }
.history .hn { grid-area: n; font-weight: 700; font-size: 14px; }
.history .hm { grid-area: m; font-size: 12px; color: var(--muted); }
.history .hp { grid-area: p; color: var(--gold); font-weight: 700; font-size: 14px; }
.history .empty { display: block; color: var(--muted); background: none; padding: 0; font-size: 14px; }
.set-actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ----- לפני הקרב ----- */
.vs-screen { align-items: center; }
.vs-stage { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; width: 100%; max-width: 760px; }
.vs-side { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.vs-side canvas { width: 100%; max-width: 260px; height: 320px; }
.vs-side h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.vs-side span { color: var(--muted); font-size: 14px; }
.vs-side.you h3 { color: #9cc0ff; }
.vs-side.them h3 { color: #ff9da1; }
.vs-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; align-self: center; }
.vs { font-family: var(--font-display); font-size: 56px; line-height: 1; color: var(--gold); font-style: italic; text-shadow: 0 4px 18px rgba(244,183,63,.35); }
.vs-mid small { color: var(--muted); white-space: nowrap; }
.title-bout { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--gold); }
.title-bout.big { font-family: var(--font-display); font-weight: 400; font-size: 22px; justify-content: center; }

// ===== אפקטים קוליים (סינתזה, בלי קבצים) =====
const Sfx = {
  ctx: null, on: true, _nb: null,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
  },
  nb() {
    if (this._nb) return this._nb;
    const c = this.ctx, b = c.createBuffer(1, c.sampleRate * 1.5, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (this._nb = b);
  },
  play(fn) {
    if (!this.on) return;
    this.init();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    try { fn(this.ctx, this.ctx.currentTime); } catch (e) { /* ignore */ }
  },
  noise(freq, dur, vol, type = 'lowpass', q = 1, delay = 0, attack = 0) {
    this.play((c, t0) => {
      const t = t0 + delay;
      const s = c.createBufferSource(); s.buffer = this.nb();
      const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = c.createGain();
      if (attack) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); }
      else g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
      s.connect(f).connect(g).connect(c.destination);
      s.start(t, Math.random() * 0.8); s.stop(t + attack + dur + 0.05);
    });
  },
  tone(freq, dur, vol, type = 'sine', slideTo = 0, delay = 0) {
    this.play((c, t0) => {
      const t = t0 + delay;
      const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
    });
  },
  hit(heavy) {
    this.noise(heavy ? 900 : 1400, heavy ? 0.2 : 0.11, heavy ? 0.8 : 0.5);
    this.tone(heavy ? 120 : 160, heavy ? 0.22 : 0.12, heavy ? 0.7 : 0.4, 'sine', 45);
  },
  block() { this.noise(2400, 0.07, 0.3, 'bandpass', 2); this.tone(300, 0.06, 0.12, 'triangle'); },
  whoosh(v = 1) { this.noise(1700, 0.12, 0.14 * v, 'bandpass', 0.8); },
  bell() {
    [0, 0.3, 0.6].forEach(d => { this.tone(1318, 1.1, 0.22, 'sine', 0, d); this.tone(2660, 0.7, 0.08, 'sine', 0, d); });
  },
  tick() { this.tone(880, 0.07, 0.18, 'square'); },
  crowd() { this.noise(1000, 1.8, 0.35, 'bandpass', 0.5, 0, 0.25); },
  cash() { this.tone(1200, 0.08, 0.15, 'triangle'); this.tone(1700, 0.16, 0.15, 'triangle', 0, 0.08); },
  click() { this.tone(600, 0.04, 0.06, 'triangle'); }
};

<script>
// ===== ציור ריאליסטי של הלוחמים והזירה (Canvas, מבט צד) =====
// תאורה: אור ראשי מלמעלה-קדימה, צל בצד האחורי, הדגשת שוליים (rim light) מהפרוז׳קטורים.
const DEFAULT_POSE = { lead: 0, rear: 0, upper: 0, block: 0, leanX: 0, duck: 0, snap: 0, fall: 0, bob: 0, stride: 0, hurt: false, win: 0, dmg: 0, sweat: 0, sway: 0, robe: false };

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = amt < 0 ? v => Math.round(v * (1 + amt)) : v => Math.round(v + (255 - v) * amt);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function shadeHex(hex, amt) {
  return '#' + shade(hex, amt).match(/\d+/g).map(v => (+v).toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}
const lerp = (a, b, t) => a + (b - a) * t;
const lp = (A, B, t) => [lerp(A[0], B[0], t), lerp(A[1], B[1], t)];

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function limb(ctx, pts, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function star(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  ctx.closePath(); ctx.fill();
}

// ---------- גפיים עם נפח (גרדיאנט גלילי + שריר) ----------
function cylGrad(ctx, A, B, w, base, light = 0.22, dark = 0.4) {
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1;
  let nx = -dy / L, ny = dx / L;
  if (ny > 0 || (ny === 0 && nx < 0)) { nx = -nx; ny = -ny; }
  const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
  const g = ctx.createLinearGradient(mx + nx * w / 2, my + ny * w / 2, mx - nx * w / 2, my - ny * w / 2);
  g.addColorStop(0, shade(base, light)); g.addColorStop(0.28, base); g.addColorStop(0.75, shade(base, -dark * 0.5)); g.addColorStop(1, shade(base, -dark));
  return g;
}
function taper(ctx, A, B, wA, wB, base, bulge, light, dark) {
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  ctx.fillStyle = cylGrad(ctx, A, B, Math.max(wA, wB) * 1.15, base, light, dark);
  ctx.beginPath();
  ctx.moveTo(A[0] + nx * wA / 2, A[1] + ny * wA / 2); ctx.lineTo(B[0] + nx * wB / 2, B[1] + ny * wB / 2);
  ctx.lineTo(B[0] - nx * wB / 2, B[1] - ny * wB / 2); ctx.lineTo(A[0] - nx * wA / 2, A[1] - ny * wA / 2);
  ctx.closePath(); ctx.fill();
  circle(ctx, A[0], A[1], wA / 2); circle(ctx, B[0], B[1], wB / 2);
  if (bulge) {
    const [t, wf] = bulge;
    ell(ctx, lerp(A[0], B[0], t), lerp(A[1], B[1], t), L * 0.34, lerp(wA, wB, t) * wf / 2, Math.atan2(dy, dx));
  }
}

// ---------- נעליים גבוהות ----------
function shoe(ctx, x, c) {

  const g = ctx.createLinearGradient(x, y - 36, x + 6, y);
  g.addColorStop(0, shade(c, 0.22)); g.addColorStop(0.55, c); g.addColorStop(1, shade(c, -0.35));

  ctx.fillStyle = shade(c, -0.4); rr(ctx, x - 12, y - 38, 19, 4, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ell(ctx, x + 16, y - 9, 5, 2, -0.3);
}

// ---------- מכנסיים ----------
function shortsPath(ctx, by) {

}

  const band = lum(c) > 0.72 ? '#1b1d22' : '#f2f2f2';
  if (pattern === 'pt_flames') {

    ctx.fillStyle = 'rgba(255,255,255,.7)'; [[-10, -16], [0, -19], [10, -14], [-4, -9], [6, -8], [-14, -6]].forEach(([x, y]) => circle(ctx, hx + x, hy + y, 1.6));
    ctx.restore();
    ctx.fillStyle = item.color;
    ctx.beginPath(); ctx.moveTo(hx - r + 2, hy - 10); ctx.lineTo(hx - r - 14, hy - 4); ctx.lineTo(hx - r - 8, hy + 6); ctx.closePath(); ctx.fill();
  } else if (item.id === 'headgear') {
    ctx.save(); ctx.beginPath(); ctx.arc(hx, hy, r + 2, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = hairFill(ctx, hx, hy, r, item.color); capPath(ctx, hx, hy, r); ctx.fill(); ctx.restore();
    ctx.strokeStyle = item.color; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(hx, hy, r + 1, Math.PI * 0.72, Math.PI * 1.9); ctx.stroke();
    ctx.fillStyle = shade(item.color, -0.1); ell(ctx, hx + 3, hy + 7, 7, 11);
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hx, hy, r + 6, Math.PI * 1.1, Math.PI * 1.75); ctx.stroke();
    ctx.strokeStyle = shade(item.color, -0.3); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx + 5, hy + 17); ctx.lineTo(hx + 13, hy + 21); ctx.stroke();
  } else if (item.id === 'crown') {
    const y = hy - r * 0.8 - (look.hairStyle === 'afro' ? 12 : look.hairStyle === 'bald' || look.hairStyle === 'buzz' ? 0 : 5);
    const g = ctx.createLinearGradient(hx, y - 20, hx, y); g.addColorStop(0, '#fff0b0'); g.addColorStop(0.5, '#f2c14e'); g.addColorStop(1, '#a8770f');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(hx - 14, y); ctx.lineTo(hx - 16, y - 17); ctx.lineTo(hx - 7, y - 8); ctx.lineTo(hx, y - 20);
    ctx.lineTo(hx + 7, y - 8); ctx.lineTo(hx + 16, y - 17); ctx.lineTo(hx + 14, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b7861c'; ctx.fillRect(hx - 14, y - 3, 28, 3);
    ctx.fillStyle = '#d23a40'; circle(ctx, hx, y - 8, 2.6);
    ctx.fillStyle = '#2f6fdb'; circle(ctx, hx - 9, y - 5, 2); circle(ctx, hx + 9, y - 5, 2);
  }
  ctx.restore();
}

// ---------- ידיים וכפפות ----------
function computeArms(p, lx, by) {
  const o = pt => [pt[0] + lx, pt[1] + by];
  const sw = Math.sin(p.sway || 0) * 2.5, sw2 = Math.cos((p.sway || 0) * 0.7) * 1.5;
  const rot = (p.upper ? 0 : p.rear * 14) - p.lead * 2;
  const sR = o([-6 + rot, -180]), sL = o([10 + p.lead * 5 - p.rear * 4, -178]);
  let gR = o([30 + sw2, -186 + sw]), gL = o([44 - sw2, -198 - sw]);
  let eR = o([6, -146]), eL = o([28, -150]);
  if (p.block > 0) {
    gR = lp(gR, o([34, -202]), p.block); gL = lp(gL, o([40, -218]), p.block);
    eR = lp(eR, o([20, -160]), p.block); eL = lp(eL, o([28, -168]), p.block);
  }
  if (p.win > 0) {
    gR = lp(gR, o([-6, -292]), p.win); gL = lp(gL, o([26, -296]), p.win);
    eR = lp(eR, o([-18, -238]), p.win); eL = lp(eL, o([30, -236]), p.win);
  }
  if (p.lead > 0) {
    const t = o([106, -204]);
    gL = lp(gL, t, p.lead); eL = lp(eL, [(sL[0] + t[0]) / 2, (sL[1] + t[1]) / 2 + 4], p.lead);
  }
  if (p.rear > 0) {
    const e = p.rear;
    if (p.upper) {
      const low = o([42, -150]), hi = o([76, -226]);
      gR = e < 0.4 ? lp(gR, low, e / 0.4) : lp(low, hi, (e - 0.4) / 0.6);
      eR = lp(eR, [gR[0] - 26, gR[1] + 32], Math.min(1, e * 1.5));
    } else {
      const t = o([102, -202]);
      gR = lp(gR, t, e); eR = lp(eR, [(sR[0] + t[0]) / 2, (sR[1] + t[1]) / 2 + 4], e);
    }
  }
  return { rear: { s: sR, e: eR, g: gR }, lead: { s: sL, e: eL, g: gL } };
}

function drawGlove(ctx, g, e, col) {
  const ang = Math.atan2(g[1] - e[1], g[0] - e[0]);
  ctx.save(); ctx.translate(g[0], g[1]); ctx.rotate(ang);
  // שרוול הכפפה עם פס לבן
  const cg = ctx.createLinearGradient(0, -10, 0, 10);
  cg.addColorStop(0, shade(col, 0.2)); cg.addColorStop(0.5, col); cg.addColorStop(1, shade(col, -0.45));
  ctx.fillStyle = cg; rr(ctx, -25, -9.5, 19, 19, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillRect(-18, -9.5, 3, 19);
  // אגרוף
  const mg = ctx.createRadialGradient(5, -7, 1, 0, 0, 19);
  mg.addColorStop(0, shade(col, 0.42)); mg.addColorStop(0.4, col); mg.addColorStop(1, shade(col, -0.5));
  ctx.fillStyle = mg; ell(ctx, 1, 0, 16.5, 14.5);
  ctx.fillStyle = shade(col, -0.12); ell(ctx, -3, -11.5, 8, 4.5, -0.2);
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(1, 0, 10.5, -1.2, 1.25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8, -7.5); ctx.quadraticCurveTo(-2, -5, 4, -8.5); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ell(ctx, 6, -7, 5.5, 2.2, -0.35);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ell(ctx, 11, 3, 2.5, 5, 0.2);
  ctx.restore();
}

function drawArm(ctx, arm, skinCol, glove, tattoo, sleeve) {
  const ux = arm.g[0] - arm.e[0], uy = arm.g[1] - arm.e[1], L = Math.hypot(ux, uy) || 1;
  const wrist = [arm.g[0] - ux / L * 16, arm.g[1] - uy / L * 16];
  taper(ctx, arm.s, arm.e, 18, 13, skinCol, [0.45, 1.18]);
  taper(ctx, arm.e, wrist, 14, 11, skinCol, [0.3, 1.1]);
  if (tattoo === 'sleeve') {
    limb(ctx, [arm.s, arm.e], 9, 'rgba(22,34,60,.38)');
    limb(ctx, [arm.e, lp(arm.e, wrist, 0.7)], 8, 'rgba(22,34,60,.38)');
  }
  if (tattoo === 'tribal' || tattoo === 'sleeve') {
    const vx = arm.e[0] - arm.s[0], vy = arm.e[1] - arm.s[1], M = Math.hypot(vx, vy) || 1, nx = -vy / M * 6, ny = vx / M * 6;
    ctx.strokeStyle = 'rgba(22,34,60,.72)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for (const t of [0.3, 0.5, 0.7]) {
      const P = lp(arm.s, arm.e, t), Q = lp(arm.s, arm.e, t + 0.1);
      ctx.beginPath(); ctx.moveTo(P[0] + nx, P[1] + ny); ctx.lineTo(Q[0], Q[1]); ctx.lineTo(P[0] - nx, P[1] - ny); ctx.stroke();
    }
  }
  if (sleeve) {
    limb(ctx, [arm.s, arm.e], 22, sleeve);
    limb(ctx, [arm.e, lp(arm.e, wrist, 0.45)], 20, sleeve);
  }
  drawGlove(ctx, arm.g, arm.e, glove);
}

// look: {skin, hairStyle, hairColor, beard, shorts, gloves, shoes, outfit}; x,y = נקודת הרגליים; dir: 1 פונה ימינה, -1 שמאלה
function drawFighter(ctx, look, x, y, dir, pose, s) {
  const p = Object.assign({}, DEFAULT_POSE, pose || {});
  ctx.save();
  ctx.translate(x, y);
  // צל רך על הרצפה
  ctx.save(); ctx.translate(-dir * p.fall * 100 * s, 3 * s); ctx.scale(1, 0.17);
  const R = (58 + p.fall * 80) * s, sg = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
  sg.addColorStop(0, 'rgba(0,0,0,.55)'); sg.addColorStop(0.6, 'rgba(0,0,0,.25)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; circle(ctx, 0, 0, R); ctx.restore();
  ctx.scale(dir * s, s);
  if (p.fall > 0) ctx.rotate(-p.fall * Math.PI / 2 * 0.96);

  const by = p.duck * 24 - p.bob, lx = p.leanX;
  const skin = look.skin, skinB = shadeHex(skin, -0.14);
  const st = p.stride;
  const hipB = [-9, -94 + by], hipF = [11, -94 + by];
  const footBx = -30 - st, footFx = 30 + st;
  const ankB = [footBx - 3, -30], ankF = [footFx - 2, -30];
  const kneeB = [(hipB[0] + ankB[0]) / 2 + 8 + p.duck * 10, (hipB[1] + ankB[1]) / 2 + 2];
  const kneeF = [(hipF[0] + ankF[0]) / 2 + 10 + p.duck * 12, (hipF[1] + ankF[1]) / 2 + 2];
  const of = look.outfit || {};
  const robe = p.robe && of.robe ? WARDROBE_BY_ID[of.robe] : null;
  const top = of.top ? WARDROBE_BY_ID[of.top] : null;
  const sleeveR = robe ? shade(robe.color, -0.25) : null, sleeveL = robe ? robe.color : null;
  const arms = computeArms(p, lx, by);
  const rearFront = p.block > 0.5 || p.win > 0.5;

  // רגל אחורית
  taper(ctx, hipB, kneeB, 28, 19, skinB, [0.45, 1.12]);
  taper(ctx, kneeB, ankB, 19, 12, skinB, [0.3, 1.2]);
  shoe(ctx, footBx, shadeHex(look.shoes, -0.2));
  if (!rearFront) drawArm(ctx, arms.rear, skinB, shadeHex(look.gloves, -0.2), of.tattoo, sleeveR);
  // רגל קדמית
  taper(ctx, hipF, kneeF, 29, 20, skin, [0.45, 1.12]);
  taper(ctx, kneeF, ankF, 20, 12.5, skin, [0.3, 1.22]);
  shoe(ctx, footFx, look.shoes);
  drawTorso(ctx, skin, lx, by, p);
  if (top) drawTop(ctx, top, lx, by);
  drawShorts(ctx, look.shorts, by, of.pattern);
  if (of.neck && !robe) drawNeck(ctx, of.neck, lx, by);
  if (robe) drawRobe(ctx, robe, lx, by);
  drawHead(ctx, look, 6 + lx - p.snap * 12, -218 + by + p.snap * 3, p);
  if (rearFront) drawArm(ctx, arms.rear, skinB, look.gloves, of.tattoo, sleeveR);
  drawArm(ctx, arms.lead, skin, look.gloves, of.tattoo, sleeveL);
  ctx.restore();
}

// ===== הזירה =====
// השכבות הסטטיות מצוירות פעם אחת לקנבס נסתר (מטמון), ובכל פריים מציירים רק מה שזז.
const Scene = { sc: 0, crowd: null, grain: null, mat: null, layers: null };
const ARENA_W = 960, ARENA_H = 440, ARENA_FLOOR = 398, LED_Y = 262, MAT_TOP = 318;

function mkCanvas(w, h, fn) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); fn(c.getContext('2d'), c.width, c.height); return c; }

function sceneAssets() {
  if (Scene.crowd) return;
  const tones = ['#141821', '#1a1f2a', '#11141b', '#20252f', '#171a22', '#231d22'];
  const crowd = [];
  for (let row = 0; row < 6; row++) {
    for (let x = -20; x < 990; x += 19 + row * 2.2) {
      crowd.push({ x: x + (Math.random() - 0.5) * 8, y: 118 + row * 25 + (Math.random() - 0.5) * 5, r: 8 + row * 1.5 + Math.random() * 1.5, c: tones[(Math.random() * tones.length) | 0], row, grp: Math.random() < 0.5 ? 0 : 1, phone: Math.random() < 0.04 });
    }
  }
  Scene.crowd = crowd;
  Scene.grain = mkCanvas(200, 200, (g, w, h) => {
    const id = g.createImageData(w, h);
    for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 16; }
    g.putImageData(id, 0, 0);
  });
  Scene.mat = mkCanvas(128, 128, (g, w, h) => {
    const id = g.createImageData(w, h);
    for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 40; id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v + 10; id.data[i + 3] = 40; }
    g.putImageData(id, 0, 0);
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
    for (let y = 0; y < h; y += 4) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  });
}

// שכבה בגודל W×h (יחידות לוגיות) החל מ-y0, ברזולוציה sc
function layer(sc, y0, h, paint) {
  return { y0, h, c: mkCanvas(ARENA_W * sc, h * sc, g => { g.scale(sc, sc); g.translate(0, -y0); paint(g); }) };
}

function buildLayers(sc) {
  sceneAssets();
  const W = ARENA_W, H = ARENA_H, floor = ARENA_FLOOR;
  const L = {};
  L.bg = layer(sc, 0, H, g => {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#030405'); bg.addColorStop(0.5, '#0a0c12'); bg.addColorStop(1, '#06070a');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
  });
  // שורות קהל: שתי קבוצות בכל שורה, כדי שיקפצו בקצב שונה
  L.crowd = [];
  for (let row = 0; row < 6; row++) for (let grp = 0; grp < 2; grp++) {
    const y0 = 118 + row * 25 - 22 - row * 1.5, h = 64 + row * 4;
    L.crowd.push({ row, grp, ...layer(sc, y0, h, g => {
      for (const c of Scene.crowd) {
        if (c.row !== row || c.grp !== grp) continue;
        g.fillStyle = c.c;
        ell(g, c.x, c.y + c.r * 1.9, c.r * 1.55, c.r * 1.25);
        circle(g, c.x, c.y, c.r);
        g.strokeStyle = `rgba(255,226,190,${0.05 + c.row * 0.035})`; g.lineWidth = 1.5;
        g.beginPath(); g.arc(c.x, c.y, c.r - 0.5, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
        if (c.phone) { g.fillStyle = 'rgba(210,230,255,.8)'; g.fillRect(c.x + 4, c.y + c.r * 0.6, 2.5, 4); }
      }
    }) });
  }
  L.mid = layer(sc, 80, 220, g => {
    const hz = g.createLinearGradient(0, 90, 0, 230);
    hz.addColorStop(0, 'rgba(12,14,20,.75)'); hz.addColorStop(1, 'rgba(12,14,20,0)');
    g.fillStyle = hz; g.fillRect(0, 90, W, 140);
    const lg = g.createLinearGradient(0, LED_Y, 0, LED_Y + 26);
    lg.addColorStop(0, '#12070a'); lg.addColorStop(0.5, '#1d0a0f'); lg.addColorStop(1, '#0c0507');
    g.fillStyle = lg; g.fillRect(0, LED_Y, W, 26);
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, LED_Y + 26, W, 3);
  });
  // פס טקסט ה-LED (נגלל)
  L.led = { c: mkCanvas(480 * sc, 26 * sc, g => {
    g.scale(sc, sc);
    g.font = '15px "Secular One", Rubik, sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'center';
    g.shadowColor = 'rgba(255,60,60,.8)'; g.shadowBlur = 8; g.fillStyle = 'rgba(255,110,100,.85)';
    g.fillText('הדרך לחגורה', 120, 13); g.fillText('ליל האליפות', 360, 13);
  }) };
  L.ring = layer(sc, 0, H, g => {
    g.save();
    g.beginPath(); g.moveTo(70, MAT_TOP); g.lineTo(W - 70, MAT_TOP); g.lineTo(W + 60, H); g.lineTo(-60, H); g.closePath(); g.clip();
    const mg = g.createLinearGradient(0, MAT_TOP, 0, H);
    mg.addColorStop(0, '#16283f'); mg.addColorStop(1, '#1d3656');
    g.fillStyle = mg; g.fillRect(0, MAT_TOP, W, H - MAT_TOP);
    g.globalAlpha = 0.6; g.fillStyle = g.createPattern(Scene.mat, 'repeat'); g.fillRect(0, MAT_TOP, W, H - MAT_TOP); g.globalAlpha = 1;
    g.save(); g.translate(W / 2, 372); g.scale(1, 0.26);
    g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 10; g.beginPath(); g.arc(0, 0, 150, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.07)'; g.font = '76px "Secular One", Rubik, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('הדרך לחגורה', 0, 0); g.restore();
    g.save(); g.translate(W / 2, floor - 6); g.scale(1, 0.2);
    const pool = g.createRadialGradient(0, 0, 0, 0, 0, 460);
    pool.addColorStop(0, 'rgba(255,244,222,.34)'); pool.addColorStop(0.55, 'rgba(255,244,222,.12)'); pool.addColorStop(1, 'rgba(255,244,222,0)');
    g.fillStyle = pool; circle(g, 0, 0, 460); g.restore();
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.1)'; g.lineWidth = 2; g.beginPath(); g.moveTo(70, MAT_TOP); g.lineTo(W - 70, MAT_TOP); g.stroke();
    const post = (x, corner) => {
      const pg = g.createLinearGradient(x - 7, 0, x + 7, 0);
      pg.addColorStop(0, '#2a2e36'); pg.addColorStop(0.45, '#9aa1ad'); pg.addColorStop(0.6, '#d9dde4'); pg.addColorStop(1, '#3a3f49');
      g.fillStyle = pg; g.fillRect(x - 6, 214, 12, 112);
      for (const y of [236, 266, 296]) {
        const tg = g.createLinearGradient(x - 11, 0, x + 11, 0);
        tg.addColorStop(0, shade(corner, -0.5)); tg.addColorStop(0.5, shade(corner, 0.15)); tg.addColorStop(1, shade(corner, -0.45));
        g.fillStyle = tg; rr(g, x - 11, y - 8, 22, 16, 5); g.fill();
      }
    };
    post(64, '#c62f38'); post(W - 64, '#2d5fc4');
    for (const [c, y] of [['#d8d8de', 236], ['#c93740', 266], ['#d8d8de', 296]]) {
      g.lineCap = 'round';
      g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 6; g.beginPath(); g.moveTo(72, y + 2); g.quadraticCurveTo(W / 2, y + 9, W - 72, y + 2); g.stroke();
      g.strokeStyle = c; g.lineWidth = 4.5; g.beginPath(); g.moveTo(72, y); g.quadraticCurveTo(W / 2, y + 7, W - 72, y); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(72, y - 1.5); g.quadraticCurveTo(W / 2, y + 5.5, W - 72, y - 1.5); g.stroke();
    }
    g.fillStyle = 'rgba(240,240,245,.8)';
    for (const x of [270, 480, 690]) g.fillRect(x - 2, 236, 4, 64);
    g.fillStyle = '#15171d'; g.fillRect(0, 10, W, 9);
    g.globalCompositeOperation = 'lighter';
    for (const lx of [200, 400, 560, 760]) {
      const beam = g.createLinearGradient(0, 18, 0, floor);
      beam.addColorStop(0, 'rgba(255,238,210,.09)'); beam.addColorStop(1, 'rgba(255,238,210,0)');
      g.fillStyle = beam; g.beginPath(); g.moveTo(lx - 10, 18); g.lineTo(lx + 10, 18); g.lineTo(lx + 130 + (lx - W / 2) * 0.2, floor); g.lineTo(lx - 130 + (lx - W / 2) * 0.2, floor); g.closePath(); g.fill();
      const lamp = g.createRadialGradient(lx, 18, 0, lx, 18, 38);
      lamp.addColorStop(0, 'rgba(255,248,230,.95)'); lamp.addColorStop(0.2, 'rgba(255,238,200,.35)'); lamp.addColorStop(1, 'rgba(255,238,200,0)');
      g.fillStyle = lamp; circle(g, lx, 18, 38);
    }
  });
  L.front = layer(sc, 0, H, g => {
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 9; g.beginPath(); g.moveTo(-10, H - 5); g.lineTo(W + 10, H - 5); g.stroke();
    const rg = g.createLinearGradient(0, H - 12, 0, H);
    rg.addColorStop(0, '#f2f2f5'); rg.addColorStop(1, '#8d8f96');
    g.strokeStyle = rg; g.lineWidth = 7; g.beginPath(); g.moveTo(-10, H - 8); g.lineTo(W + 10, H - 8); g.stroke();
    const v = g.createRadialGradient(W / 2, H * 0.55, H * 0.45, W / 2, H * 0.55, W * 0.72);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  });
  return L;
}

function sceneLayers(ctx) {
  const m = ctx.getTransform(), sc = Math.min(2, Math.max(0.5, Math.round(Math.hypot(m.a, m.b) * 4) / 4));
  if (!Scene.layers || Scene.sc !== sc) { Scene.layers = buildLayers(sc); Scene.sc = sc; }
  return Scene.layers;
}
// הפונטים נטענים אחרי הציור הראשון: בונים מחדש את השכבות כשהם מוכנים
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { Scene.layers = null; });

const blit = (ctx, l, dy = 0) => ctx.drawImage(l.c, 0, l.y0 + dy, ARENA_W, l.h);

<script>
// ===== מנוע הקרב =====
const FW = 960, FH = 440, FLOOR = 398, RING_L = 110, RING_R = 850, MIN_DIST = 92, FSCALE = 1.18, DODGE_T = 0.38;
const PUNCHES = {
  jab:   { name: 'ג׳אב',    dmg: 5,  sta: 7,  wind: 0.11, rec: 0.17, reach: 165, stun: 0.12, push: 6 },
  cross: { name: 'קרוס',    dmg: 10, sta: 13, wind: 0.19, rec: 0.26, reach: 160, stun: 0.24, push: 12 },

class Fight {
  constructor(o) {

    document.addEventListener('visibilitychange', this.vis);

  }

    else if (c === 'ArrowDown' || c === 'KeyS') this.input.block = down;

  }

  knockdown(d, a) {
    d.hp = 0; d.down = true; d.kd++; d.action = null; d.combo = null; d.stun = 0; d.blocking = false; d.dodgeT = 0;
    a.action = null; a.combo = null; a.blocking = false;
    a.score += 25;
    this.state = 'down'; this.stateT = 0; this.count = 0; this.countT = 0; this.downF = d; this.mash = 0;
    this.slowmo = 0.7;
    this.mashNeed = Math.max(8, 10 + d.kd * 7 - Math.floor(d.st.chin / 8));
    this.shake = 14; this.hype = 1;
    this.input = { left: false, right: false, block: false };
    Sfx.hit(true); Sfx.crowd();
    buzz(d.isPlayer ? [120, 60, 220] : 60);
    this.banner('נוקדאון!', d.isPlayer ? 'לחץ על כפתורי האגרוף במהירות כדי לקום' : '', 1.4);
    if (!d.isPlayer) {
      const p = 0.95 - (d.kd - 1) * 0.3 + (d.st.chin - a.st.power) / 80;
      d.willRise = d.kd < 3 && Math.random() < p;
      d.riseAt = 3 + Math.floor(Math.random() * 5);
    }
  }

  updateDown(dt) {
    const d = this.downF, a = d === this.p ? this.o : this.p;
    const home = a === this.p ? 250 : 710;
    a.x += clamp(home - a.x, -220 * dt, 220 * dt);
    a.sta = Math.min(a.maxSta, a.sta + 25 * dt);
    if (d.kd >= 3 && this.stateT > 1.6) { this.finish(a, 'TKO', 'שלושה נוקדאונים בקרב'); return; }
    this.countT += dt;
    if (this.countT >= 0.9) {
      this.countT = 0; this.count++; Sfx.tick();
      if (this.count >= 10) { this.finish(a, 'KO', 'נספר עד 10'); return; }
    }
    if (this.count >= 1 && d.kd < 3) {
      const rise = d.isPlayer ? this.mash >= this.mashNeed && this.count >= 2 : d.willRise && this.count >= d.riseAt;
      if (rise) {
        d.down = false; d.hp = Math.max(d.maxHp * 0.2, d.maxHp * (0.55 - 0.12 * d.kd)); d.hpLag = d.hp;
        d.sta = Math.max(d.sta, d.maxSta * 0.6); d.stun = 0.3;
        this.state = 'fight'; this.stateT = 0;
        this.banner('קם על הרגליים!', '', 1);
      }
    }
  }

  endRound() {
    Sfx.bell();
    if (this.round >= this.rounds) { this.decision(); return; }
    this.state = 'break'; this.stateT = 0;
    this.p.action = this.o.action = null; this.p.blocking = this.o.blocking = false;
    this.banner(`סוף סיבוב ${this.round}`, 'מנוחה בפינה…', 3.2);
  }
  nextRound() {
    this.round++; this.timer = this.roundLen;
    for (const f of [this.p, this.o]) {
      f.hp = Math.min(f.maxHp, f.hp + f.maxHp * 0.22); f.hpLag = f.hp; f.sta = f.maxSta;
      f.action = null; f.combo = null; f.stun = 0; f.dodgeT = 0;
    }
    this.p.x = 330; this.o.x = 630;
    this.state = 'intro'; this.stateT = 0;
    this.banner(this.round === this.rounds ? 'סיבוב אחרון' : `סיבוב ${this.round}`, '', 1.6);
  }
  decision() {
    const ps = this.p.score, os = this.o.score, won = ps >= os, tot = ps + os || 1, r = this.rounds, cards = [];
    for (let j = 0; j < 3; j++) {
      const m = clamp(Math.round(Math.abs(ps - os) / tot * r * 3 + rand(-1, 1)), 1, r * 2), w = 10 * r;
      cards.push(won ? `${w}-${w - m}` : `${w - m}-${w}`);
    }
    this.finish(won ? this.p : this.o, 'DEC', 'החלטת שופטים', cards);
  }
  finish(winner, method, note, cards) {
    const won = winner === this.p;
    this.state = 'over'; this.stateT = 0;
    this.result = {
      won, method, note, cards: cards || null, round: this.round,
      landed: this.p.landed, thrown: this.p.thrown, oLanded: this.o.landed, oThrown: this.o.thrown,
      kdFor: this.o.kd, kdAgainst: this.p.kd
    };
    Sfx.crowd();
    const big = method === 'DEC' ? (won ? 'ניצחון!' : 'הפסד') : method === 'KO' ? 'נוקאאוט!' : 'TKO!';
    this.banner(big, won ? `${this.p.name} מנצח` : `${this.o.name} מנצח`, 3);
  }
  forfeit() {
    this.paused = false;
    this.finish(this.o, 'RET', 'כניעה');
    this.stateT = 2.4;
  }

  // ---------- אפקטים ----------
  spark(x, y, heavy, blocked) {
    const n = blocked ? 6 : heavy ? 16 : 10;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(80, heavy ? 420 : 280);
      this.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: rand(0.25, 0.55), t: 0, c: blocked ? '#cfd6e4' : Math.random() < 0.5 ? 'rgba(235,245,255,.9)' : 'rgba(190,215,240,.75)', r: rand(1.5, 3.5) });
    }
    this.rings.push({ x, y, t: 0, max: heavy ? 60 : 40, c: blocked ? '200,210,230' : '255,226,150' });
  }
  say(text, x, y, color, size) { this.texts.push({ text, x, y, color, size, t: 0 }); }
  banner(text, sub, dur) { this.ban = { text, sub, t: 0, dur }; }
  updateFx(dt) {
    for (const q of this.particles) { q.t += dt; q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    this.particles = this.particles.filter(q => q.t < q.life);
    for (const r of this.rings) r.t += dt;
    this.rings = this.rings.filter(r => r.t < 0.3);
    for (const t of this.texts) { t.t += dt; t.y -= 40 * dt; }
    this.texts = this.texts.filter(t => t.t < 0.9);
    if (this.ban) { this.ban.t += dt; if (this.ban.t > this.ban.dur) this.ban = null; }
    if (Math.random() < dt * (0.4 + this.hype * 4)) this.flashes.push({ x: rand(0, FW), y: rand(130, 250), t: 0 });
    for (const f of this.flashes) f.t += dt;
    this.flashes = this.flashes.filter(f => f.t < 0.18);
  }

  // ---------- ציור ----------
  poseOf(f) {
    const p = {
      block: f.blockV, snap: f.snap, fall: f.fall, hurt: f.stun > 0.05, win: f.winV,
      bob: f.down || f.winV > 0.5 ? 0 : Math.abs(Math.sin(f.bobT * 4.6)) * 3.6 * (f.sta / f.maxSta * 0.6 + 0.4),
      sway: f.bobT * 2.3, stride: Math.sin(f.walkT * 14) * f.moveAmt * 7,
      dmg: Math.min(1, (f.taken || 0) / (f.maxHp * 1.6)), sweat: Math.min(1, this.elapsed / 140)
    };
    const a = f.action;
    if (a) {
      const e = clamp(a.t < a.wind ? 1 - Math.pow(1 - a.t / a.wind, 2) : 1 - (a.t - a.wind) / a.rec, 0, 1);
      if (a.type === 'jab') { p.lead = e; p.leanX = e * 4; }
      else if (a.type === 'cross') { p.rear = e; p.leanX = e * 10; }
      else { p.rear = e; p.upper = 1; p.leanX = e * 6; p.duck = a.t < a.wind ? Math.sin(e * Math.PI) * 0.3 : 0; }
    }
    if (f.dodgeT > 0) { const k = Math.sin((1 - f.dodgeT / DODGE_T) * Math.PI); p.duck = Math.max(p.duck || 0, k * 0.9); p.leanX = -16 * k; }
    return p;
  }

  render() {
    const c = this.canvas;
    if (!sizeCanvas(c)) return;
    const ctx = this.ctx, k = c.width / FW, t = performance.now() / 1000;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.save();
    if (this.shake > 0) ctx.translate(rand(-1, 1) * this.shake, rand(-1, 1) * this.shake);
    drawArenaScene(ctx, FW, FH, t, this.hype, this.flashes, FLOOR);
    const order = this.o.action && !this.p.action ? [this.p, this.o] : [this.o, this.p];
    for (const f of order) drawFighter(ctx, f.look, f.x, FLOOR, f.dir, this.poseOf(f), f.scale);
    for (const q of this.particles) { ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c; circle(ctx, q.x, q.y, q.r); }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const r of this.rings) {
      const e = r.t / 0.3, rad = 10 + r.max * 0.7 * e, fg = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, rad);
      fg.addColorStop(0, `rgba(${r.c},${0.7 * (1 - e)})`); fg.addColorStop(1, `rgba(${r.c},0)`);
      ctx.fillStyle = fg; circle(ctx, r.x, r.y, rad);
    }
    ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const tx of this.texts) {
      ctx.globalAlpha = 1 - tx.t / 0.9; ctx.font = `700 ${tx.size}px Rubik, sans-serif`;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(tx.text, tx.x, tx.y);
      ctx.fillStyle = tx.color; ctx.fillText(tx.text, tx.x, tx.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    drawArenaFront(ctx, FW, FH, t);
    this.drawOverlay(ctx);
    this.updateHud();
  }

  drawOverlay(ctx) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (this.state === 'down') {
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(0, 0, FW, FH);
      if (this.count > 0) {
        const pulse = 1 + (1 - Math.min(1, this.countT / 0.25)) * 0.25;
        ctx.save(); ctx.translate(FW / 2, 150); ctx.scale(pulse, pulse);
        ctx.font = '120px "Secular One", Rubik, sans-serif'; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,.7)';
        ctx.strokeText(String(this.count), 0, 0); ctx.fillStyle = '#fff'; ctx.fillText(String(this.count), 0, 0); ctx.restore();
      }
      if (this.downF === this.p && this.p.kd < 3) {
        const w = 320, pr = Math.min(1, this.mash / this.mashNeed);
        ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(ctx, FW / 2 - w / 2, 236, w, 18, 9); ctx.fill();
        ctx.fillStyle = pr >= 1 ? '#2ec27e' : '#f4b73f'; rr(ctx, FW / 2 - w / 2 + 3, 239, (w - 6) * pr, 12, 6); ctx.fill();
        ctx.font = '700 20px Rubik, sans-serif'; ctx.fillStyle = '#fff';
        ctx.fillText('לחץ על כפתורי האגרוף מהר כדי לקום!', FW / 2, 280);
      }
    }
    if (this.state === 'break') { ctx.fillStyle = 'rgba(5,6,10,.55)'; ctx.fillRect(0, 0, FW, FH); }
    const b = this.ban;
    if (b) {
      const inT = Math.min(1, b.t / 0.18), outT = Math.min(1, (b.dur - b.t) / 0.25), a = Math.min(inT, outT);
      const y = this.state === 'down' ? 60 : 130;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(FW / 2, y); const sc = 0.8 + 0.2 * inT; ctx.scale(sc, sc);
      ctx.font = '64px "Secular One", Rubik, sans-serif'; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(b.text, 0, 0); ctx.fillStyle = '#ffffff'; ctx.fillText(b.text, 0, 0);
      if (b.sub) { ctx.font = '600 22px Rubik, sans-serif'; ctx.lineWidth = 6; ctx.strokeText(b.sub, 0, 52); ctx.fillStyle = '#ffd27a'; ctx.fillText(b.sub, 0, 52); }
      ctx.restore();
    }
  }

  updateHud() {
    const h = this.hud;
    const set = (el, f) => {
      el.hp.style.width = (f.hp / f.maxHp * 100).toFixed(1) + '%';
      el.lag.style.width = (f.hpLag / f.maxHp * 100).toFixed(1) + '%';
      el.sta.style.width = (f.sta / f.maxSta * 100).toFixed(1) + '%';
      el.sta.classList.toggle('low', f.sta < f.maxSta * 0.25);
      const kd = '●'.repeat(f.kd);
      if (el.kd.textContent !== kd) el.kd.textContent = kd;
    };
    set(h.p, this.p); set(h.o, this.o);
    const s = Math.ceil(this.timer), txt = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if (h.time.textContent !== txt) h.time.textContent = txt;
    const rt = `סיבוב ${this.round}/${this.rounds}`;
    if (h.round.textContent !== rt) h.round.textContent = rt;
  }
}

<script>
// ===== מסכים, קריירה ושמירה =====
const app = document.getElementById('app');
let S = load();
let draft = null, currentFight = null, hubTab = 'fights', wrTry = null;
if (S && !S.outfit) S.outfit = { owned: [], equip: {} };
if (S && (S.v || 1) < 2) {
  // הסולם גדל מ-10 ל-18 יריבים: ממפים את ההתקדמות הישנה למקום המקביל בסולם החדש
  const map = [0, 2, 3, 5, 6, 8, 9, 10, 14, 17, 18];
  S.next = map[Math.min(S.next, 10)]; S.style = 'balanced'; S.styles = ['balanced']; S.v = 2;
}

// מראה השחקן כולל הלבוש (אפשר להוסיף פריט "במדידה")
function playerLook(tryId) {
  const equip = { ...(S ? S.outfit.equip : {}) };
  if (tryId) equip[WARDROBE_BY_ID[tryId].slot] = tryId;
  return { ...S.look, outfit: equip };
}

function load() { try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* אין אחסון */ } }
try { Sfx.on = localStorage.getItem(SAVE_KEY + '-sound') !== 'off'; } catch (e) { /* */ }

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');

function toast(msg, kind = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, 2200);
}

// ---------- חישובי קריירה ----------
function gearBonus(stat) { const g = GEAR.find(x => x.stat === stat); return GEAR_BONUS[S.gear[g.id]]; }
function effStats() { const s = {}; for (const d of STAT_DEFS) s[d.id] = S.stats[d.id] + gearBonus(d.id); return s; }
function ovr(st) { return Math.round(Object.values(st).reduce((a, b) => a + b, 0) / 5); }
function nextOpponent() { return S.next < OPPONENTS.length ? OPPONENTS[S.next] : challenger(S.defenses); }
function trainCost(lvl) { return 20 + lvl * 4; }
function workPay() { return 100 + S.record.w * 15; }
function rankName() {
  if (S.belts.includes('חגורת אלוף העולם')) return 'אלוף העולם';
  if (S.next >= WORLD_TIER_AT) return 'דרג עולמי';
  if (S.belts.length) return 'אלוף לאומי';
  if (S.next >= NATIONAL_TIER_AT) return 'דרג לאומי';
  return S.record.w ? 'דרג אזורי' : 'טירון';
}

// ---------- ניווט ----------
const isTouch = window.matchMedia('(pointer: coarse)').matches;
function enterFightMode() {
  // בטלפון: מסך מלא ונעילה לרוחב (כשהדפדפן מרשה)
  if (!isTouch) return;
  try {
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    const p = req && !document.fullscreenElement ? req.call(el) : null;
    const lock = () => { try { const q = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (q && q.catch) q.catch(() => {}); } catch (e) { /* */ } };
    if (p && p.then) p.then(lock).catch(() => {}); else lock();
  } catch (e) { /* לא נתמך */ }
}
function exitFightMode() {
  try {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch (e) { /* */ }
}

function go(screen, arg) {
  if (currentFight) { currentFight.destroy(); currentFight = null; }
  if (screen !== 'fight') exitFightMode();

// ---------- יצירת לוחם ----------
function swatchGroup(key, label, colors) {
  return `<div class="field"><span class="flabel">${label}</span>
    <div class="swatches" role="radiogroup" aria-label="${label}" data-group="${key}">
      ${colors.map(c => `<button type="button" class="swatch${draft.look[key] === c ? ' on' : ''}" style="--c:${c}" data-act="pick" data-k="${key}" data-v="${c}" role="radio" aria-checked="${draft.look[key] === c}" aria-label="${label} ${c}"></button>`).join('')}
    </div></div>`;
}
function chipGroup(key, label, items) {
  return `<div class="field"><span class="flabel">${label}</span>
    <div class="chips" role="radiogroup" aria-label="${label}" data-group="${key}">
      ${items.map(i => `<button type="button" class="chip${draft.look[key] === i.id ? ' on' : ''}" data-act="pick" data-k="${key}" data-v="${i.id}" role="radio" aria-checked="${draft.look[key] === i.id}">${i.name}</button>`).join('')}
    </div></div>`;
}
function renderCreate(edit) {
  draft = edit ? { edit: true, name: S.name, nick: S.nick, look: { ...S.look } } : { edit: false, name: '', nick: '', look: { ...DEFAULT_LOOK } };
  app.innerHTML = `
  <section class="screen create">
    <header class="topbar">
      <button class="btn btn-icon" data-act="${edit ? 'hub' : 'title'}" aria-label="חזרה">→</button>
      <h2>${edit ? 'עריכת הלוחם' : 'יצירת לוחם'}</h2>
    </header>
    <div class="create-grid">
      <div class="preview-card card">
        <canvas class="preview-lg" aria-label="תצוגה מקדימה של הלוחם"></canvas>
        <div class="pv-name" id="pvName"></div>
        <button class="btn btn-ghost btn-sm" data-act="randomize">מראה אקראי</button>
      </div>
      <div class="options card">
        <div class="field-row">
          <div class="field"><label class="flabel" for="fName">שם הלוחם</label><input id="fName" maxlength="16" placeholder="למשל: דני כהן" autocomplete="off"></div>
          <div class="field"><label class="flabel" for="fNick">כינוי <span class="opt">(לא חובה)</span></label><input id="fNick" maxlength="14" placeholder="למשל: הפטיש" autocomplete="off"></div>
        </div>
        ${swatchGroup('skin', 'צבע עור', LOOK_OPTIONS.skin)}
        ${chipGroup('hairStyle', 'תספורת', LOOK_OPTIONS.hairStyle)}
        ${swatchGroup('hairColor', 'צבע שיער', LOOK_OPTIONS.hairColor)}
        ${chipGroup('beard', 'זקן', LOOK_OPTIONS.beard)}
        ${swatchGroup('shorts', 'מכנסיים', LOOK_OPTIONS.cloth)}
        ${swatchGroup('gloves', 'כפפות', LOOK_OPTIONS.cloth)}
        ${swatchGroup('shoes', 'נעליים', LOOK_OPTIONS.cloth)}
        <p class="form-err" id="formErr" hidden></p>
        <button class="btn btn-red btn-lg sweep" data-act="${edit ? 'saveLook' : 'startCareer'}">${edit ? 'שמור שינויים' : 'התחל קריירה'}</button>
      </div>
    </div>
  </section>`;
  const fn = document.getElementById('fName'), fk = document.getElementById('fNick');
  fn.value = draft.name; fk.value = draft.nick;
  const upd = () => {
    draft.name = fn.value.trim(); draft.nick = fk.value.trim();
    document.getElementById('pvName').innerHTML = (draft.name ? esc(draft.name) : '<span class="muted">הלוחם שלך</span>') + (draft.nick ? ` <span class="nick">"${esc(draft.nick)}"</span>` : '');
  };
  fn.addEventListener('input', upd); fk.addEventListener('input', upd); upd();
  fighterPreview(app.querySelector('.preview-lg'), () => edit ? { ...draft.look, outfit: S.outfit.equip } : draft.look, 1, { jab: true, glow: 'rgba(217,54,62,.22)' });
}
function refreshGroup(k) {
  app.querySelectorAll(`[data-group="${k}"] [data-act="pick"]`).forEach(b => {
    const on = b.dataset.v === draft.look[k]; b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
  });
}

// ---------- מרכז הקריירה ----------
function renderHub(tab) {
  const keepScroll = !tab || tab === hubTab, y = window.scrollY;
  if (tab) hubTab = tab;
  if (hubTab !== 'wardrobe') wrTry = null;
  const eff = effStats();
  const tabs = [['fights', 'קרבות', 't-red'], ['train', 'אימונים', 't-green'], ['shop', 'חנות', 't-gold'], ['wardrobe', 'מלתחה', 't-purple'], ['profile', 'פרופיל', 't-blue']];
  app.innerHTML = `
  <section class="screen hub">
    <header class="profile-bar card">
      <canvas class="preview-sm" aria-hidden="true"></canvas>
      <div class="pb-main">
        <div class="pb-name">${esc(S.name)}${S.nick ? ` <span class="nick">"${esc(S.nick)}"</span>` : ''}</div>
        <div class="pb-meta">
          <span class="rank-pill">${rankName()}</span>
          <span class="style-pill">סגנון: ${STYLES[S.style].name}</span>
          <span>מאזן <b class="num">${S.record.w}-${S.record.l}</b></span>
          <span><b class="num">${S.record.ko}</b> נוקאאוטים</span>
          <span>שבוע <b class="num">${S.week}</b></span>
        </div>
        <div class="energy"><span>אנרגיה</span><div class="bar"><i style="width:${S.energy}%" class="${S.energy < 35 ? 'low' : ''}"></i></div><b class="num">${S.energy}</b></div>
      </div>
      <div class="pb-side">
        <div class="money num">$${fmt(S.money)}</div>
        <div class="ovr"><b class="num">${ovr(eff)}</b><span>דירוג כללי</span></div>
        ${S.belts.length ? `<div class="belts">${S.belts.map(b => `<span class="belt" title="${b}"></span>`).join('')}</div>` : ''}
      </div>
    </header>
    <nav class="tabs" role="tablist">
      ${tabs.map(([id, name, cls]) => `<button role="tab" class="tab ${cls}${hubTab === id ? ' on' : ''}" aria-selected="${hubTab === id}" data-act="tab" data-tab="${id}">${name}</button>`).join('')}
    </nav>
    <div class="tab-body">${({ fights: tabFights, train: tabTrain, shop: tabShop, wardrobe: tabWardrobe, profile: tabProfile })[hubTab]()}</div>
  </section>`;
  fighterPreview(app.querySelector('.preview-sm'), () => playerLook(), 1, { phase: 1, robe: true });
  const oc = app.querySelector('.preview-opp');
  if (oc) { const o = nextOpponent(); fighterPreview(oc, () => o.look, -1, { jab: true, phase: 2, glow: 'rgba(217,54,62,.18)' }); }
  const wc = app.querySelector('.preview-wr');
  if (wc) {
    fighterPreview(wc, () => playerLook(wrTry), 1, { jab: true, robe: true, glow: 'rgba(139,92,246,.25)' });
    app.querySelectorAll('.wr-item canvas').forEach(c => {
      const it = WARDROBE_BY_ID[c.dataset.id];
      drawPortrait(c, playerLook(it.id), it.slot);
    });
  }
  if (keepScroll) window.scrollTo(0, y);
}

function tabWardrobe() {

  const slots = WARDROBE_SLOTS.map(sl => {

      const owned = own.has(w.id), worn = eq[w.slot] === w.id, afford = S.money >= w.price;
      const btn = worn ? `<button class="btn btn-sm btn-ghost" data-act="unwear" data-id="${w.id}">הסר</button>`
        : owned ? `<button class="btn btn-sm btn-purple" data-act="wear" data-id="${w.id}">לבש</button>`
        : `<button class="btn btn-sm btn-gold" data-act="buyWear" data-id="${w.id}" ${afford ? '' : 'disabled'}><span class="num">$${fmt(w.price)}</span></button>`;
      return `<article class="wr-item${worn ? ' worn' : ''}${wrTry === w.id ? ' trying' : ''}" data-act="tryOn" data-id="${w.id}">

function tapeRow(label, a, b) {
  const M = 75;
  return `<div class="tape-row">
    <span class="tv num ${a > b ? 'up' : ''}">${a}</span>
    <div class="tb you"><i style="width:${Math.min(100, a / M * 100)}%"></i></div>
    <span class="tl">${label}</span>
    <div class="tb them"><i style="width:${Math.min(100, b / M * 100)}%"></i></div>
    <span class="tv num ${b > a ? 'up' : ''}">${b}</span>
  </div>`;
}

  </section>`;

  currentFight = new Fight({

function applyResult(res, o) {
  let earned = 0, bonus = 0;
  const methodName = { KO: 'נוקאאוט', TKO: 'TKO', DEC: 'החלטת שופטים', RET: 'כניעה' }[res.method];
  if (res.won) {
    earned = o.purse;
    if (res.method !== 'DEC') bonus = Math.round(o.purse * 0.3);
    S.record.w++; if (res.method !== 'DEC') S.record.ko++;
    if (o.defense) S.defenses++; else S.next++;
    if (o.title && !S.belts.includes(o.title)) S.belts.push(o.title);
  } else {
    earned = res.method === 'RET' ? 0 : Math.round(o.purse * 0.35);
    S.record.l++;
  }
  S.money += earned + bonus;
  S.energy = Math.max(0, S.energy - 45); S.week++;
  S.history.unshift({ opp: o.name, won: res.won, method: methodName, round: res.method === 'DEC' ? 0 : res.round, earned: earned + bonus });
  S.history = S.history.slice(0, 30);
  save();
  return { ...res, o, earned, bonus, methodName, newBelt: res.won && o.title ? o.title : null };
}

    </div>
    ${!r.won ? '<p class="muted center">כל הפסד הוא שיעור. תתאמן, תשדרג ציוד ותחזור לזירה — אותו יריב מחכה לך.</p>' : ''}
    <button class="btn ${r.won ? 'btn-green' : 'btn-blue'} btn-lg sweep" data-act="hub">חזרה לחדר הכושר</button>
  </section>`;
  if (r.won) Sfx.cash();
  fighterPreview(app.querySelector('.result-fighter'), () => playerLook(), 1, r.won ? { win: true, glow: 'rgba(244,183,63,.3)' } : { glow: 'rgba(63,127,240,.18)' });
}

// ---------- פעולות ----------
const ACTIONS = {
  new() {
    if (S && !confirm('להתחיל קריירה חדשה? הקריירה הנוכחית תימחק.')) return;
    go('create', false);
  },
  continue() { go('hub'); },
  title() { go('title'); },
  hub() { go('hub'); },
  tab(b) { renderHub(b.dataset.tab); },
  pick(b) { draft.look[b.dataset.k] = b.dataset.v; refreshGroup(b.dataset.k); Sfx.click(); },
  randomize() {
    const r = a => a[(Math.random() * a.length) | 0];
    draft.look = { skin: r(LOOK_OPTIONS.skin), hairStyle: r(LOOK_OPTIONS.hairStyle).id, hairColor: r(LOOK_OPTIONS.hairColor), beard: r(LOOK_OPTIONS.beard).id, shorts: r(LOOK_OPTIONS.cloth), gloves: r(LOOK_OPTIONS.cloth), shoes: r(LOOK_OPTIONS.cloth) };
    Object.keys(draft.look).forEach(refreshGroup);
  },
  startCareer() {
    if (!draft.name) { showErr('תן ללוחם שם לפני שמתחילים.'); return; }
    S = newCareer(draft.name, draft.nick, draft.look); save(); hubTab = 'fights'; go('hub');
    toast('הקריירה התחילה! היריב הראשון כבר מחכה.');
  },
  saveLook() {
    if (!draft.name) { showErr('ללוחם חייב להיות שם.'); return; }
    S.name = draft.name; S.nick = draft.nick; S.look = draft.look; save(); go('hub'); toast('השינויים נשמרו');
  },
  train(b) {
    const id = b.dataset.id, lvl = S.stats[id], cost = trainCost(lvl);
    if (S.money < cost || S.energy < TRAIN_ENERGY || lvl >= STAT_MAX) return;
    S.money -= cost; S.energy -= TRAIN_ENERGY;
    let gain = 1;
    if (S.coach && Math.random() < 0.5) gain++;
    if (Math.random() < 0.12) gain++;
    S.stats[id] = Math.min(STAT_MAX, lvl + gain);
    save(); renderHub();
    const name = STAT_DEFS.find(d => d.id === id).name;
    toast(gain > 1 ? `אימון מעולה! ${name} +${gain}` : `${name} +1`, 'good');
  },
  rest() { S.energy = 100; S.week++; save(); renderHub(); toast(`שבוע ${S.week} — אתה רענן לגמרי`); },
  work() {
    if (S.energy < 30) return;
    const pay = workPay(); S.money += pay; S.energy -= 30; save(); renderHub(); Sfx.cash(); toast(`הרווחת $${pay}`, 'gold');
  },
  buyGear(b) {
    const g = GEAR.find(x => x.id === b.dataset.id), tier = S.gear[g.id];
    if (tier >= 3 || S.money < GEAR_PRICE[tier + 1]) return;
    S.money -= GEAR_PRICE[tier + 1]; S.gear[g.id]++; save(); renderHub(); Sfx.cash();
    toast(`קנית ${g.tiers[tier + 1]}`, 'gold');
  },
  buyExtra(b) {
    const x = EXTRAS.find(e => e.id === b.dataset.id);
    if (S.money < x.price || (x.once && S[x.id])) return;
    if (x.id === 'drink' && S.energy >= 100) { toast('האנרגיה שלך כבר מלאה'); return; }
    S.money -= x.price;
    if (x.id === 'drink') S.energy = Math.min(100, S.energy + 40);
    if (x.id === 'massage') S.energy = 100;
    if (x.id === 'coach') S.coach = true;
    save(); renderHub(); Sfx.cash(); toast(`קנית ${x.name}`, 'gold');
  },
  learnStyle(b) {
    const id = b.dataset.id, st = STYLES[id];
    if (S.styles.includes(id) || S.money < st.price) return;
    S.money -= st.price; S.styles.push(id); S.style = id; save(); renderHub(); Sfx.cash();
    toast(`למדת את סגנון ה${st.name}!`, 'gold');
  },
  setStyle(b) {
    if (!S.styles.includes(b.dataset.id)) return;
    S.style = b.dataset.id; save(); renderHub(); Sfx.click(); toast(`הסגנון שלך עכשיו: ${STYLES[S.style].name}`);
  },
  tryOn(b) { wrTry = wrTry === b.dataset.id ? null : b.dataset.id; Sfx.click(); renderHub(); },
  buyWear(b) {
    const w = WARDROBE_BY_ID[b.dataset.id];
    if (S.money < w.price || S.outfit.owned.includes(w.id)) return;
    S.money -= w.price; S.outfit.owned.push(w.id); S.outfit.equip[w.slot] = w.id;
    if (wrTry === w.id) wrTry = null;
    save(); renderHub(); Sfx.cash(); toast(`קנית ${w.name} — כבר עליך`, 'gold');
  },
  wear(b) {
    const w = WARDROBE_BY_ID[b.dataset.id];
    if (!S.outfit.owned.includes(w.id)) return;
    S.outfit.equip[w.slot] = w.id; if (wrTry === w.id) wrTry = null;
    save(); renderHub(); Sfx.click();
  },
  unwear(b) {
    const w = WARDROBE_BY_ID[b.dataset.id];
    delete S.outfit.equip[w.slot]; save(); renderHub(); Sfx.click();
  },
  toVs() { go('vs'); },
  fight() { enterFightMode(); go('fight'); },
  pause() { if (currentFight) currentFight.cmd('pause'); },
  resume() { if (currentFight && currentFight.paused) currentFight.togglePause(); },
  forfeit() { if (currentFight && confirm('לזרוק את המגבת? זה ייחשב הפסד בלי תשלום.')) { currentFight.togglePause(); currentFight.forfeit(); } },
  editLook() { go('create', true); },
  sound() { Sfx.on = !Sfx.on; try { localStorage.setItem(SAVE_KEY + '-sound', Sfx.on ? 'on' : 'off'); } catch (e) { /* */ } renderHub(); },
  reset() {
    if (!confirm('למחוק את הקריירה לצמיתות? אין דרך לשחזר.')) return;
    S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* */ } go('title');
  }
};
function showErr(m) { const e = document.getElementById('formErr'); e.textContent = m; e.hidden = false; document.getElementById('fName').focus(); }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  Sfx.init();
  const fn = ACTIONS[b.dataset.act];
  if (fn) fn(b);
});

go(S ? 'title' : 'title');

</script>
