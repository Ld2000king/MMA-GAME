<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>MMA 8-Bit Fighters Preview</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{position:fixed;inset:0}
#rotate{display:none;position:fixed;inset:0;z-index:999;background:#090d14;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900;padding:28px}
.game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#151a25,#090d14)}
.stage{position:absolute;inset:0;background:
radial-gradient(circle at 50% 18%,rgba(255,255,255,.08),transparent 30%),
linear-gradient(to bottom,#1b2432 0 64%,#171b22 64% 100%)}
.crowd{position:absolute;left:0;right:0;top:19%;height:32%;opacity:.32;background:
radial-gradient(circle at 8% 30%,#aeb5c2 0 5px,transparent 6px),
radial-gradient(circle at 18% 65%,#8993a2 0 5px,transparent 6px),
radial-gradient(circle at 33% 28%,#b2bac5 0 5px,transparent 6px),
radial-gradient(circle at 47% 62%,#8d96a4 0 5px,transparent 6px),
radial-gradient(circle at 61% 31%,#b3bbc5 0 5px,transparent 6px),
radial-gradient(circle at 76% 66%,#929aa6 0 5px,transparent 6px),
radial-gradient(circle at 91% 35%,#b5bdc8 0 5px,transparent 6px);
background-size:120px 70px}
.cage{position:absolute;left:4%;right:4%;top:17%;bottom:15%;border:3px solid #78849377;border-radius:18px;
background:repeating-linear-gradient(62deg,transparent 0 21px,#a7b0bd13 21px 23px),repeating-linear-gradient(-62deg,transparent 0 21px,#a7b0bd13 21px 23px)}
.floor{position:absolute;left:6%;right:6%;bottom:5%;height:35%;border-radius:50%;background:radial-gradient(ellipse,#424b59,#242b35 63%,#10141b 78%);border:3px solid #ffffff16;transform:perspective(420px) rotateX(58deg)}
.hud{position:absolute;z-index:30;top:max(7px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr auto 1fr;gap:9px;direction:ltr}
.card{background:#080b11dd;border:1px solid #ffffff20;border-radius:14px;padding:7px 9px}
.row{display:flex;justify-content:space-between;font-size:11px;font-weight:1000}
.bar{height:9px;border-radius:99px;background:#252b35;overflow:hidden;margin-top:5px}
.fill{height:100%;transition:width .15s} .hp{width:100%;background:linear-gradient(90deg,#ff4b4b,#ff7656)} .sp{width:0%;background:linear-gradient(90deg,#23c6ff,#63edaf)}
.round{background:#080b11dd;border:1px solid #ffffff20;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:1000;white-space:nowrap;align-self:start}
.fighter{position:absolute;z-index:12;bottom:14%;height:59%;width:34%;display:flex;align-items:flex-end;justify-content:center;transition:left .12s,right .12s,filter .08s,transform .13s}
.fighter img{height:100%;max-width:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 12px 9px #0008)}
#player{left:11%} #enemy{right:11%}
#enemy img{transform:scaleX(-1)}
.fighter.hit{filter:brightness(1.9)} .fighter.attack{transform:translateX(28px) scale(1.03)} #enemy.attack{transform:translateX(-28px) scale(1.03)}
.fighter.kick{transform:translateX(34px) rotate(-3deg)} #enemy.kick{transform:translateX(-34px) rotate(3deg)}
.fighter.super{transform:translateX(56px) scale(1.08);filter:drop-shadow(0 0 18px #34ffd5)} #enemy.super{transform:translateX(-56px) scale(1.08);filter:drop-shadow(0 0 18px #ff7d45)}
.fighter.ko{transform:rotate(83deg) translateY(22px);transform-origin:bottom center}
.msg{position:absolute;z-index:35;left:50%;top:42%;transform:translate(-50%,-50%);font-size:30px;font-weight:1000;text-shadow:0 4px 15px #000;opacity:0;pointer-events:none}
.msg.show{animation:pop .55s ease} @keyframes pop{20%{opacity:1;transform:translate(-50%,-60%) scale(1.18)}100%{opacity:0;transform:translate(-50%,-95%) scale(.9)}}
.controls{position:absolute;z-index:40;left:0;right:0;bottom:max(7px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:8px 14px;direction:ltr;pointer-events:none}
.dpad,.actions{pointer-events:auto;display:flex;gap:8px} .actions{display:grid;grid-template-columns:repeat(2,68px);grid-template-rows:repeat(2,52px);gap:7px}
button{border:1px solid #ffffff25;color:#fff;font-weight:1000;background:#171d27e8;box-shadow:0 7px 18px #0008;touch-action:none}
.dpad button{width:61px;height:61px;border-radius:50%;font-size:22px} .actions button{border-radius:17px;font-size:11px}
#punch{background:#9e3030}#kick{background:#7040a0}#block{background:#315d8e}#superBtn{background:#226f60}#superBtn.ready{background:#00a979;box-shadow:0 0 22px #2cffd276}
.select{position:absolute;inset:0;z-index:100;background:radial-gradient(circle at 50% 5%,#283247,#0b1019 56%,#06080d);display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom))}
.select h1{margin:2px 0 3px;text-align:center;font-size:22px;letter-spacing:1px} .select p{margin:0 0 9px;text-align:center;font-size:11px;color:#b8c0cc}
.roster{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;direction:ltr}
.char{position:relative;border:2px solid #ffffff1b;border-radius:18px;overflow:hidden;background:linear-gradient(#252d3a,#10151d);padding:4px;display:flex;align-items:flex-end;justify-content:center}
.char.selected{border-color:#53efbd;box-shadow:0 0 22px #43eab74a}
.char img{max-width:100%;height:88%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 6px #0008)}
.label{position:absolute;left:5px;right:5px;bottom:5px;background:#070a0dcf;border:1px solid #ffffff1d;border-radius:10px;padding:5px 3px;text-align:center;font-size:10px;font-weight:1000}
.start{margin:9px auto 0;width:min(290px,70vw);height:42px;border-radius:14px;background:#13885f;font-size:14px}
@media(max-height:430px){.select h1{font-size:17px}.select p{display:none}.char img{height:84%}.fighter{height:56%;bottom:13%}.controls{padding:5px 10px}.dpad button{width:54px;height:54px}.actions{grid-template-columns:repeat(2,60px);grid-template-rows:repeat(2,45px)}.hud{top:4px}.card{padding:5px 7px}.bar{height:7px}}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>

<div id="rotate">סובב את הטלפון לרוחב ↻<br><span style="font-size:13px;font-weight:500;opacity:.7">ה־Preview בנוי ל־Landscape</span></div>
<div class="game">
  <div class="stage"><div class="crowd"></div><div class="cage"></div><div class="floor"></div></div>
  <div class="hud">
    <div class="card"><div class="row"><span id="pname">WOLFBORN</span><span id="pstate">READY</span></div><div class="bar"><div class="fill hp" id="php"></div></div><div class="bar"><div class="fill sp" id="psp"></div></div></div>

    <div class="card"><div class="row"><span id="estate">AI</span><span id="ename">KAI</span></div><div class="bar"><div class="fill hp" id="ehp"></div></div><div class="bar"><div class="fill sp" id="esp"></div></div></div>

  <div class="fighter" id="player"><img id="pimg"></div>
  <div class="fighter" id="enemy"><img id="eimg"></div>
  <div class="msg" id="msg"></div>
  <div class="controls">
    <div class="dpad"><button id="left">◀</button><button id="right">▶</button></div>
    <div class="actions"><button id="punch">PUNCH</button><button id="kick">KICK</button><button id="block">BLOCK</button><button id="superBtn">SUPER</button></div>
  </div>

  <section class="select" id="select">

    <div class="roster" id="roster"></div>
    <button class="start" id="startBtn">START FIGHT</button>
  </section>
</div>

function rgbaToDataURL(b64,w=12,h=18){
  const bin=atob(b64), arr=new Uint8ClampedArray(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const cx=cv.getContext('2d'); cx.putImageData(new ImageData(arr,w,h),0,0);
  return cv.toDataURL('image/png');
}
const ASSETS={

};

let selected = 0;
let gameStarted = false;
let gameOver = false;
let roundTime = 60;
let aiTick = 0;
let moveTimer = null;

let P = {x:.24, hp:100, sp:0, block:false, busy:false};
let E = {x:.76, hp:100, sp:0, block:false, busy:false};

function bindTap(node, fn){
  node.addEventListener('pointerup', e => { e.preventDefault(); fn(e); });
  node.addEventListener('touchend', e => { e.preventDefault(); fn(e); }, {passive:false});
}

rosterData.forEach((c,i)=>{
  const card=document.createElement('button');
  card.type='button';
  card.className='char'+(i===0?' selected':'');
  card.innerHTML='<img src="'+c.img+'" alt="'+c.name+'"><div class="label">'+c.name+'<br><span style="opacity:.65;font-weight:600">'+c.role+'</span></div>';
  bindTap(card, ()=>{
    selected=i;
    [...el.roster.children].forEach(x=>x.classList.remove('selected'));
    card.classList.add('selected');
  });
  el.roster.appendChild(card);
});

function updateUI(){
  el.php.style.width=P.hp+'%';
  el.ehp.style.width=E.hp+'%';
  el.psp.style.width=P.sp+'%';
  el.esp.style.width=E.sp+'%';
  el.superBtn.classList.toggle('ready',P.sp>=100);
  el.pstate.textContent=P.block?'BLOCK':(P.sp>=100?'SUPER READY':'READY');
  el.estate.textContent=E.block?'BLOCK':'AI';
}

function setupFight(){
  const pc=rosterData[selected];
  const candidates=[0,1,2,3].filter(i=>i!==selected);
  const ei=candidates[Math.floor(Math.random()*candidates.length)];
  const ec=rosterData[ei];

  el.pname.textContent=pc.name;
  el.ename.textContent=ec.name;
  el.pimg.src=pc.img;
  el.eimg.src=ec.img;

  P={x:.24,hp:100,sp:0,block:false,busy:false};
  E={x:.76,hp:100,sp:0,block:false,busy:false};
  gameStarted=true; gameOver=false; roundTime=60; aiTick=0;
  el.timer.textContent=roundTime;

  el.player.className='fighter';
  el.enemy.className='fighter';
  el.player.style.left='11%';
  el.enemy.style.right='11%';
  updateUI();
}

bindTap(el.startBtn, ()=>{
  setupFight();
  el.select.style.display='none';
});

function flash(txt){
  el.msg.textContent=txt;
  el.msg.classList.remove('show');
  void el.msg.offsetWidth;
  el.msg.classList.add('show');
}

function distance(){ return Math.abs(P.x-E.x); }

function applyHit(att,def,type){
  const range=type==='kick'?.19:type==='super'?.24:.15;
  if(Math.abs(att.x-def.x)>range){ flash('MISS'); return; }

  let dmg=type==='punch'?8:type==='kick'?13:28;
  if(def.block) dmg=Math.max(1,Math.ceil(dmg*.3));

  def.hp=Math.max(0,def.hp-dmg);
  att.sp=Math.min(100,att.sp+(type==='super'?0:18));
  def.sp=Math.min(100,def.sp+10);
  if(type==='super') att.sp=0;

  const target = def===P ? el.player : el.enemy;
  target.classList.add('hit');
  setTimeout(()=>target.classList.remove('hit'),120);

  def.x += Math.sign(def.x-att.x)*(type==='super'?.08:type==='kick'?.045:.025);
  flash(def.block?'BLOCK':'-'+dmg);

  if(def.hp<=0){
    gameOver=true;
    target.classList.add('ko');
    flash(att===P?'YOU WIN':'RIVAL WINS');
  }
  updateUI();
}

function act(att,def,type,node){
  if(!gameStarted || gameOver || att.busy) return;
  if(type==='super' && att.sp<100){ flash('SUPER NOT READY'); return; }

  att.busy=true;
  att.block=false;
  const cls=type==='punch'?'attack':type;
  node.classList.add(cls);

  setTimeout(()=>applyHit(att,def,type), type==='super'?240:type==='kick'?170:120);
  setTimeout(()=>{
    node.classList.remove(cls);
    att.busy=false;
  }, type==='super'?620:type==='kick'?420:300);
}

bindTap(el.punch, ()=>act(P,E,'punch',el.player));
bindTap(el.kick, ()=>act(P,E,'kick',el.player));
bindTap(el.superBtn, ()=>act(P,E,'super',el.player));

function blockOn(e){
  e.preventDefault();
  if(!gameStarted || gameOver || P.busy) return;
  P.block=true; updateUI();
}
function blockOff(e){
  if(e) e.preventDefault();
  P.block=false; updateUI();
}
el.block.addEventListener('pointerdown',blockOn);
el.block.addEventListener('touchstart',blockOn,{passive:false});
['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>{
  el.block.addEventListener(ev,blockOff,{passive:false});
});

function move(delta){
  if(!gameStarted || gameOver || P.busy) return;
  P.x=Math.max(.08,Math.min(.83,P.x+delta));
  el.player.style.left=(P.x*100-13)+'%';
}
function bindHold(node,delta){
  const start=(e)=>{
    e.preventDefault();
    clearInterval(moveTimer);
    move(delta);
    moveTimer=setInterval(()=>move(delta),70);
  };
  const stop=(e)=>{
    if(e) e.preventDefault();
    clearInterval(moveTimer);
    moveTimer=null;
  };
  node.addEventListener('pointerdown',start);
  node.addEventListener('touchstart',start,{passive:false});
  ['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>{
    node.addEventListener(ev,stop,{passive:false});
  });
}
bindHold(el.left,-.025);
bindHold(el.right,.025);

setInterval(()=>{
  if(!gameStarted || gameOver) return;

  aiTick--;
  if(aiTick>0) return;
  aiTick=1+Math.floor(Math.random()*2);

  const d=distance();
  if(d>.17){
    E.x += P.x>E.x ? .035 : -.035;
    el.enemy.style.right=((1-E.x)*100-13)+'%';
    return;
  }

  const r=Math.random();
  if(E.sp>=100 && r<.2) act(E,P,'super',el.enemy);
  else if(r<.55) act(E,P,'punch',el.enemy);
  else if(r<.85) act(E,P,'kick',el.enemy);
  else {
    E.block=true; updateUI();
    setTimeout(()=>{E.block=false;updateUI();},450);
  }
},500);

setInterval(()=>{
  if(!gameStarted || gameOver) return;
  if(roundTime>0){
    roundTime--;
    el.timer.textContent=roundTime;
  }
  if(roundTime===0){
    gameOver=true;
    flash(P.hp>=E.hp?'YOU WIN':'RIVAL WINS');
  }
},1000);

updateUI();
</script>
</body>
</html>
